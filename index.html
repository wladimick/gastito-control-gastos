<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gastito · Control de gastos</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      document.addEventListener('click', function (event) {
        const trigger = event.target.closest('button')
        if (!trigger || trigger.textContent.trim() !== 'Ver facturación') return

        const navigationButton = Array.from(document.querySelectorAll('button')).find(function (button) {
          return button !== trigger && button.textContent.trim() === 'Facturación'
        })
        if (navigationButton) navigationButton.click()
      })
    </script>
  </body>
</html>
