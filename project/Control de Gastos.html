<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastito · Control de gastos</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:        #FAFAF7;
    --bg-elev:   #FFFFFF;
    --ink:       #1A1A18;
    --ink-2:     #3D3D3A;
    --ink-3:     #B8B8B0;
    --muted:     #8A8A82;
    --line:      #E9E7E0;
    --hover:     #F2F0E9;
    --accent:    oklch(0.62 0.13 165);
    --accent-ink:oklch(0.36 0.08 165);
    --accent-soft: oklch(0.94 0.04 165);
    --amber-ink: oklch(0.42 0.13 70);
    --amber-soft:oklch(0.94 0.06 80);
  }

  html, body {
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .font-mono, code, pre, input[type="number"] {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-feature-settings: "ss01" on, "cv11" on;
  }
  /* Scrollbar mínima */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }
  /* Inputs */
  select { background-image: none; }
  /* Animaciones helpers */
  @keyframes spin { to { transform: rotate(360deg); } }
  .animate-spin { animation: spin 0.9s linear infinite; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="helpers.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="layout.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>
<script type="text/babel" src="expenses.jsx"></script>
<script type="text/babel" src="expense-modal.jsx"></script>
<script type="text/babel" src="budgets.jsx"></script>
<script type="text/babel" src="recurring.jsx"></script>
<script type="text/babel" src="installments.jsx"></script>
<script type="text/babel" src="reports.jsx"></script>
<script type="text/babel" src="comparison.jsx"></script>

<script type="text/babel" src="unparsed.jsx"></script>
<script type="text/babel" src="audit.jsx"></script>
<script type="text/babel" src="bot-chat.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
