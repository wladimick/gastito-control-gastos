name: Apply planning and reports redesign

on:
  push:
    branches:
      - agent/planificacion-reportes-v2-20260804
    paths:
      - '.chatgpt/planificacion-reportes.part-*'
      - '.github/workflows/apply-planificacion-reportes-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/planificacion-reportes-v2-20260804
          fetch-depth: 0

      - name: Verify and apply payload
        shell: bash
        run: |
          set -euo pipefail
          echo 'fe75f1501271c1778259f568d5194b411d99798e45b931b618de12dce8d17f67  .chatgpt/planificacion-reportes.part-00' | sha256sum -c -
          echo '5017a14c41cb7317c5773015f9becff198bf8b8e08186768dfa86b887d60efc1  .chatgpt/planificacion-reportes.part-01' | sha256sum -c -
          echo '23a62205a5721d8fa3b78e6aa040aa19dc6531a222f95f96b82529ab286d71e2  .chatgpt/planificacion-reportes.part-02' | sha256sum -c -
          echo 'd6ace87d5717e0cd3c9d83710ed24d0674303ad28ff7478aca2c8439cf42f6c8  .chatgpt/planificacion-reportes.part-03' | sha256sum -c -
          cat .chatgpt/planificacion-reportes.part-* | base64 -d > /tmp/gastito-v43.tar.gz
          echo 'c902aca3113fff65b1f6617c45702ade3a868857f80af4bb01594f7ca851f940  /tmp/gastito-v43.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gastito-v43.tar.gz
          rm -rf .chatgpt
          rm -f .github/workflows/apply-planificacion-reportes-v2.yml

      - name: Commit clean implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: alinear planificación y reportes'
          git push origin HEAD:agent/planificacion-reportes-v2-20260804
