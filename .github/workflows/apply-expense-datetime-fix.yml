name: Aplicar corrección de fecha y hora

on:
  push:
    branches:
      - agent/fix-fecha-hora-gastos-20260805

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/fix-fecha-hora-gastos-20260805

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Aplicar corrección
        run: node scripts/apply-expense-datetime-fix.mjs

      - name: Validar build
        run: npm run build

      - name: Publicar resultado limpio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix: respetar fecha y hora local en gastos"
          git push
